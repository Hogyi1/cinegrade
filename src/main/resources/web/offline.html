<!DOCTYPE html>
<!-- [AI-GENERATED] -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineGrade - Offline</title>
    <style>
        /* Dark tokens copied from css/theme.css (the WebView cannot read JavaFX looked-up colors) */
        :root {
            --clr-dark: #121316;
            --clr-almostdarkgrey: #1c1e22;
            --clr-surface-card: #32363d;
            --clr-border: #383c44;
            --clr-border-subtle: #2d3036;
            --clr-blue: #146BD1;
            --clr-warning: #f59e0b;
            --clr-text-primary: #FFFFFF;
            --clr-text-secondary: #AAB8C2;
            --clr-text-muted: #848484;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 32px;
            background: var(--clr-almostdarkgrey);
            color: var(--clr-text-primary);
            font-family: "Segoe UI", sans-serif;
            user-select: none;
        }

        /* Outer plate, as .import-plate */
        .plate {
            width: 100%;
            max-width: 460px;
            padding: 16px;
            background: var(--clr-surface-card);
            border: 1px solid var(--clr-border-subtle);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        /* Inner plate, as .inner-plate */
        .inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 32px 24px;
            background: var(--clr-dark);
            border: 2px solid var(--clr-blue);
            border-radius: 16px;
            text-align: center;
        }

        .logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--clr-border);
            border-radius: 12px;
            color: var(--clr-warning);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--clr-warning);
        }

        h1 {
            margin: 4px 0 0;
            font-size: 18px;
            font-weight: bold;
        }

        p {
            margin: 0;
            max-width: 340px;
            color: var(--clr-text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .hint {
            color: var(--clr-text-muted);
            font-size: 11.5px;
        }

        /* [AI-GENERATED] Retry icon in the top right corner of the inner plate */
        .inner {
            position: relative;
        }

        .retry {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            background: transparent;
            border: 1px solid var(--clr-border);
            border-radius: 8px;
            color: var(--clr-text-secondary);
            cursor: pointer;
        }

        .retry:hover {
            background: var(--clr-almostdarkgrey);
            border-color: var(--clr-blue);
            color: var(--clr-text-primary);
        }

        .retry:focus-visible {
            outline: 2px solid var(--clr-blue);
            outline-offset: 2px;
        }

        .retry svg {
            width: 16px;
            height: 16px;
        }

        .retry.busy svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="plate">
    <div class="inner">
        <!-- [AI-GENERATED] Asks the app to load the site again; still offline means this page comes back -->
        <button class="retry" type="button" title="Try again" aria-label="Try again" onclick="retry(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                <polyline points="21 3 21 9 15 9"/>
            </svg>
        </button>
        <img class="logo" src="../images/icons/cine-logo.png" alt="CineGrade">
        <span class="status">Offline</span>
        <h1>Can't reach CineGrade Socials</h1>
        <p>The web platform didn't respond. Check your internet connection or try again later.</p>
        <p class="hint">Your projects and edits are stored locally and still work offline.</p>
    </div>
</div>
<script>
    // [AI-GENERATED] window.cinegradeDesktop is DesktopBridge, attached by SocialsController once this page has loaded
    function retry(button) {
        if (window.cinegradeDesktop) {
            button.classList.add('busy');
            window.cinegradeDesktop.retry();
        }
    }
</script>
</body>
</html>
